plugins { id 'com.android.application' }

android {
    namespace 'dev.youbal.callrecphone'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.youbal.callrecphone'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release { minifyEnabled false }
    }

    lint { abortOnError true }
}

dependencies {
    // Your call-recording library. Resolved from ../callrec when that folder exists, otherwise from JitPack.
    implementation 'com.github.Youbal-oops.callrec:recorderlib:0.2.0'
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
